<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Panel de Administración</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        // Forzamos al portero a mirar a Netlify desde el segundo 1
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        // Esto es un truco extra: le inyectamos la URL de Netlify a la configuración local
        if (localStorage.getItem("netlifySiteURL") === null) {
            localStorage.setItem("netlifySiteURL", "https://willowy-kelpie-22e4d8.netlify.app");
        }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>

</html>
